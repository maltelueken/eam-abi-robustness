_target_: bayesflow.networks.FlowMatching
# FlowMatching subnets receive a tuple (target, time, conditions); the plain
# "mlp" subnet only accepts a single tensor, so use the time-conditioned MLP.
subnet: time_mlp
subnet_kwargs:
  _target_: builtins.dict
  widths:
    _target_: sweeper.constant_list
    length: ${inference_mlp_depth}
    value:
      _target_: builtins.pow
      base: 2
      exp: ${inference_mlp_width}
  dropout: 0.00
# Uniform training times, as before BayesFlow 2.0.14. The new default (0.5) draws t = u^1.5,
# which puts ~63% of training on the noise half of the path (t < 0.5) and ~7% on the last tenth,
# near the posterior, where the velocity field for a strongly contracted posterior has to be sharpest.
time_power_law_alpha: 0.0
integrate_kwargs:
  _target_: builtins.dict
  method: euler
  steps: 100
