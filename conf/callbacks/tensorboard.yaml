# keras.callbacks.TensorBoard writes event files via tensorflow.summary, so this
# group requires tensorflow to be installed (it is not a project dependency).
- _target_: keras.callbacks.TensorBoard
  write_graph: false
- _target_: keras.callbacks.ModelCheckpoint
  filepath: checkpoints/model.keras
  save_weights_only: false
  monitor: loss
  mode: min
  save_best_only: true
- _target_: keras.callbacks.CSVLogger
  filename: history.csv