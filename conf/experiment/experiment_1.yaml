# @package _global_

defaults:
- override /test_case: num_obs_grid

hydra:
  run:
    dir: outputs/${hydra:runtime.choices.experiment}/${hydra:runtime.choices.model}/${hydra:runtime.choices.inference-method}/${hydra.job.override_dirname}
  sweep:
    dir: multirun
    subdir: ${hydra:runtime.choices.experiment}/${hydra:runtime.choices.model}/${hydra:runtime.choices.inference-method}/${hydra.job.override_dirname}
  job:
    chdir: True
    env_set:
      KERAS_BACKEND: jax
    config:
      override_dirname:
        item_sep: "/"
        # Group choices that already appear in hydra.run.dir, so they must not be repeated
        # in the override_dirname suffix.
        exclude_keys:
          - experiment
          - model
          - inference-method
          - summary-method
          - mcmc
          - test_case
  job_logging:
    handlers:
      file:
        mode: w

seed: 2024

eval_num_obs: 1000

diag_batch_size: 100
diag_num_posterior_samples: 1000

epochs: 100
iterations_per_epoch: 500
batch_size: 64

# Which set of held-out data a run compares against. Defaults to the model itself; study 5's
# accuracy-band models override it so a family's four training conditions share one set, since
# their test cases and MCMC ground truth are identical.
model_family: ${hydra:runtime.choices.model}

# Shared across inference methods: test data and MCMC ground truth do not depend on the
# approximator, so every method is compared against the same held-out data.
test_data_path: ${hydra:runtime.cwd}/outputs/${hydra:runtime.choices.experiment}/${model_family}

test_batch_size: 100
test_num_posterior_samples: 2000

# scripts/prior_stats.py: the figures take 0.1% and 99.9% quantiles of these draws, which
# needs far more than test_batch_size samples to be meaningful.
prior_stats_num_draws: 20000

psrf_threshold: 1.01

# One case may be selected by key (`case=sample_size_50`); null fits every case.
case: null

# GPU-parallelized MCMC fitting (scripts/fit_mcmc_gpu.py): vmaps BlackJAX NUTS over chains
# *and* over every dataset in one call. See mcmc.fit_mcmc_gpu_batch.
mcmc_sampling_fun:
  _target_: mcmc.fit_mcmc_gpu_batch
  _partial_: true
  _convert_: object
  num_chains: 4
  num_steps_warmup: 2000
  num_steps_sampling: ${test_num_posterior_samples}
  rng_key:
    _target_: jax.random.key
    seed: ${seed}
