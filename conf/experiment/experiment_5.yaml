# @package _global_

# Study 5: hold the prior fixed and manipulate the accuracy of the generated data instead.
# The prior is study 2's full meta prior; each training condition and each test case keeps only
# simulated datasets whose empirical accuracy falls in a band.
#
# Accuracy is a deterministic function of `x`, so the selection indicator cancels out of
# `p(theta | x, accuracy in band) = p(theta | x)`: the MCMC reference needs no correction for the
# band, and the four conditions of a family can share one set of fits. What the study measures is
# therefore amortization coverage -- how an approximator degrades on data it was never shown --
# rather than the prior misspecification of studies 2 and 3.
defaults:
- experiment_1
- override /test_case: accuracy_bins

diag_batch_size: 1000

test_num_obs: 500
