# @package _global_

# Everything the MCMC side of the simple RDM needs: the log-density, the parameter vector
# it is defined over, the parameterization that describes it, and the transform between
# natural and unconstrained space.
# The hyperparameters come from the simulator's prior (`mcmc_prior` below), so the MCMC prior
# and the training prior cannot drift apart -- and no script needs to reach into the config to
# bind them by hand.
mcmc_param_names: ["v_intercept", "v_slope", "s_true", "b", "t0"]

# The parameterization the log-density, the simulator and the sampler all read: which
# coefficients the vector holds, in what order, and on which link. `eamax.design` owns it, so
# `mcmc_param_names` above and the spec cannot disagree about the layout, and
# `mcmc.t0_support` finds `t0` in it *by name* rather than assuming it is last. `noise_scale`
# is the non-target accumulator's fixed noise, interpolated from the simulator so the model
# fitted and the model simulated from identify their scale the same way.
mcmc_spec:
  _target_: eamax.design.rdm_intercept_slope_spec
  noise_scale: ${simulator.experiment_simulator.sample_fn.s_false}

# The training prior: every hyperparameter the prior simulator's `_partial_` binds, read out of
# it whole rather than interpolated one at a time. The log-density, the chains' starting values
# and `mcmc_log_prior_fun` all build their distributions from it with the same
# `priors.*_prior_dists` function the simulator draws the data from, so the prior the data were
# generated under and the prior NUTS targets are one definition, not two transcriptions of it.
mcmc_prior:
  _target_: priors.hyperparameters
  sample_fn: ${simulator.prior_simulator.sample_fn}

mcmc_model_fun:
  _target_: rdm_jax.make_rdm_simple_logdensity
  _partial_: true
  prior: ${mcmc_prior}

# The prior as something to *draw from*, for the chains' starting values -- built from the same
# distributions `mcmc_log_prior_fun` scores against (`priors.rdm_simple_prior_dists`), so a chain
# cannot start from one prior and target another. `mcmc.make_init_positions_fn` unconstrains each
# draw with `mcmc_transform` and rejects it back into the `t0` support, which is why there is no
# `init_position` here any more: every chain gets its own dispersed, in-support draw, where all
# four used to be handed the same fixed vector.
mcmc_prior_sample_fun:
  _target_: rdm_jax.make_rdm_simple_prior_sample
  prior: ${mcmc_prior}

# Natural scale <-> the unconstrained space NUTS explores, and the matching log-det-Jacobian,
# in one object so the three cannot fall out of step. An empty bounded block is the ordinary
# all-positive case; `conf/mcmc/*_meta.yaml` fills it with the Sigmoid the hierarchical models'
# prior hyperparameter needs.
mcmc_transform:
  _target_: eamax.inference.transforms.BlockTransform

# The prior's density, for scripts/prior_distance.py. Separate from `mcmc_model_fun`, which folds
# the prior into the posterior log-density the sampler needs; the hyperparameters interpolate from
# the same place, so the measured prior and the fitted prior cannot drift apart either.
mcmc_log_prior_fun:
  _target_: rdm_jax.make_rdm_simple_log_prior
  prior: ${mcmc_prior}
