# @package _global_

defaults:
- lba_simple_meta
- override /simulator: lba_meta_acc_medium

# All four bands of a family train against the same wide prior and are evaluated on the
# same accuracy bins, so their held-out data and MCMC ground truth are identical -- one
# shared directory instead of four copies of the most expensive artifact in the pipeline.
model_family: lba_acc

# Study 4 borrows this network too, and study 5 is what trains it -- so the empirical study
# reads the checkpoint from there rather than from study 2's directory. Only
# conf/experiment/experiment_4.yaml interpolates this; every other study reads what its own
# train_npe run wrote.
npe_experiment: experiment_5
