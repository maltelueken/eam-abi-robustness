# @package _global_

# Study 1's unconditioned arm: the training grid is the test sweep itself
# (`rdm_simple_discrete_full`), but the inference network is not given `sqrt(num_obs)` --
# the count reaches it only through the summary network's pooling over `x`. Read against
# `rdm_simple_discrete_full`, which differs in nothing else, it separates *covering* a
# trial count in training from being *told* it at inference time.
defaults:
- rdm_simple_discrete_full
- override /approximator/adapter: rdm_simple_no_num_obs
