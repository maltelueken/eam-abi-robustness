# @package _global_

defaults:
- rdm_simple_meta
- override /simulator: rdm_meta_acc_medium

# All four bands of a family train against the same wide prior and are evaluated on the
# same accuracy bins, so their held-out data and MCMC ground truth are identical -- one
# shared directory instead of four copies of the most expensive artifact in the pipeline.
model_family: rdm_acc
