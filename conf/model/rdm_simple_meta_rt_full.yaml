# @package _global_

defaults:
- rdm_simple_meta
- override /simulator: rdm_meta_rt_full

# All four windows of a family train against the same wide prior and are evaluated on the
# same response-time windows, so their held-out data and MCMC ground truth are identical --
# one shared directory instead of four copies of the most expensive artifact in the pipeline.
model_family: rdm_rt
