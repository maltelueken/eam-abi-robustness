# Study 6 training condition: the prior is study 2's full meta prior, unchanged, and only the
# *data* are restricted -- `simulation` keeps drawing until every dataset in the batch has all
# of its response times inside this window. This is the unrestricted condition: 99.6% of the
# prior already lands in it, so it is the baseline the three narrow conditions are read against.
defaults:
- lba_meta

rt_lower: 0.0
rt_upper: 20.0
