# Which hyperparameter this simulator randomizes. Spelled out rather than interpolated from
# `meta_param_name`: that lives in conf/test_case/drift_slope_grid.yaml, so interpolating it
# made every hierarchical model fail to compose under any other study's test-case group -- and
# study 5 reuses this simulator with a different one. tests/test_config.py checks that the name
# here matches the one the study-2 test cases sweep.
# Amortized over only the two grid points below the 1.5 the `_simple` models train on, so
# the rest of the sweep falls outside the range of priors it was trained on.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: design.random_prior_meta_continuous_multivariate
  _partial_: true
  min_value: [0.7]
  max_value: [1.1]
  name:
  - drift_slope_loc
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true
