# Study 2's medium-varying arm: amortized over the middle third of the swept grid, the three
# points either side of the 2.3 rdm_medium.yaml pins. The three narrow varying arms tile the
# grid in thirds -- see ..._multivariate_lower.yaml for why a third rather than one grid step.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: design.random_prior_meta_continuous_multivariate
  _partial_: true
  min_value: [1.9]
  max_value: [2.7]
  name:
  - drift_slope_loc
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true
