# Study 3's hierarchical variant: the location of the prior on the threshold difference is
# itself drawn per dataset, so the approximator is amortized over the hyperparameter the test
# cases sweep -- the whole 0.4-2.0 grid of conf/test_case/threshold_diff_grid.yaml.
# The name must match the one swept there and stored in `mcmc_param_names` in
# conf/mcmc/rdm_sat_meta.yaml; tests/test_config.py checks that it does.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: design.random_prior_meta_continuous_multivariate
  _partial_: true
  min_value: [0.4]
  max_value: [2.0]
  name:
  - threshold_diff_loc
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true
