# Study 3's hierarchical variant, amortized over only the first two points of the swept grid,
# so the rest of it falls outside the range of priors it was trained on. Matches how study 2's
# random_prior_meta_continuous_multivariate_lower.yaml is cut.
# See random_prior_meta_continuous_sat.yaml for the full-range version.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: design.random_prior_meta_continuous_multivariate
  _partial_: true
  min_value: [0.4]
  max_value: [0.6]
  name:
  - threshold_diff_loc
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true
