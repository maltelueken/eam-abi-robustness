# Study 3's hierarchical variant, amortized over only the lower part of the swept range,
# so the rest of the test grid falls outside the range of priors it was trained on.
# See random_prior_meta_continuous_sat.yaml for the full-range version.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: design.random_prior_meta_continuous_multivariate
  _partial_: true
  min_value: [0.02]
  max_value: [0.06]
  name:
  - threshold_diff_scale
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true
