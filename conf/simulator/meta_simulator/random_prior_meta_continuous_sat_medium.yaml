# Study 3's medium-varying arm: amortized over the middle third of the swept grid, the three
# points either side of the 1.2 rdm_sat.yaml pins. The three narrow varying arms tile the grid
# in thirds -- see random_prior_meta_continuous_sat_lower.yaml for why a third rather than one
# grid step. See random_prior_meta_continuous_sat.yaml for the full-range version.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: design.random_prior_meta_continuous_multivariate
  _partial_: true
  min_value: [1.0]
  max_value: [1.4]
  name:
  - threshold_diff_loc
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true
