# Study 3's hierarchical variant, amortized over the top third of the swept grid -- its last
# three points -- so the rest of it falls outside the range of priors it was trained on. A third
# rather than the one grid step it used to be; see ..._sat_lower.yaml. Study 2's
# ..._multivariate_upper.yaml is cut the same way.
# See random_prior_meta_continuous_sat.yaml for the full-range version.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: design.random_prior_meta_continuous_multivariate
  _partial_: true
  min_value: [1.6]
  max_value: [2.0]
  name:
  - threshold_diff_loc
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true
