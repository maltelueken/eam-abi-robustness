# Study 2's medium-fixed arm: a point prior at 2.3, the *centre* grid point of
# conf/test_case/drift_slope_grid.yaml. It exists because rdm_simple.yaml's 1.5 is only the
# third of nine points -- inside the bottom third of the sweep -- so using it as the "medium"
# arm made the low-varying model look like the medium-fixed one (0.81 overlap on the marginal
# prior). rdm_simple.yaml stays where it is: studies 1, 4, 5 and 6 train on it, and study 4
# borrows its study-2 checkpoint outright.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: priors.lba_prior_simple
  _partial_: true
  drift_intercept_loc: 2
  drift_intercept_scale: 0.5
  drift_slope_loc: 2.3
  drift_slope_scale: 0.5
  sd_true_shape: 12
  sd_true_scale: 0.1
  sp_max_shape: 6
  sp_max_scale: 0.1
  threshold_shape: 8
  threshold_scale: 0.15
  t0_loc: 0.3
  t0_scale: 0.2
  t0_lower: 0.0
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true # one call draws the whole batch; see the priors module docstring
