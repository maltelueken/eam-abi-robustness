# Study 3 (LBA), trained at the lower end of the swept range: this approximator only ever
# sees a small speed-accuracy effect (mean threshold-gap difference 0.12), so all but the
# smallest test case lies outside its training prior. lba_sat.yaml is the centred version.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: priors.lba_prior_sat
  _partial_: true
  drift_intercept_loc: 2
  drift_intercept_scale: 0.5
  drift_slope_loc: 1.5
  drift_slope_scale: 0.5
  sd_true_shape: 12
  sd_true_scale: 0.1
  sp_max_shape: 6
  sp_max_scale: 0.1
  threshold_shape: 8
  threshold_scale: 0.15
  threshold_diff_shape: 6
  threshold_diff_scale: 0.02
  t0_loc: 0.3
  t0_scale: 0.2
  t0_lower: 0.0
  rng:
    _target_: numpy.random.default_rng
    seed: ${seed}
is_batched: true # one call draws the whole batch; see the priors module docstring
