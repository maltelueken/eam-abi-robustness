# Study 3's low-fixed arm: a point prior at threshold_diff_loc 0.8, the *inner* edge of the
# low-varying arm's U(0.4, 0.8), for the reason given in lba_lower.yaml -- on every case above
# 0.8 the fixed and varying arms extrapolate from the same point. lba_sat.yaml is the centred
# version and explains the mean/sd parameterization.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: priors.lba_prior_sat
  _partial_: true
  drift_intercept_loc: 2
  drift_intercept_scale: 0.5
  drift_slope_loc: 1.5
  drift_slope_scale: 0.5
  sd_true_shape: 12
  sd_true_scale: 0.1
  sp_max_shape: 6
  sp_max_scale: 0.1
  threshold_shape: 8
  threshold_scale: 0.15
  threshold_diff_loc: 0.8
  threshold_diff_sd: 0.245
  t0_loc: 0.3
  t0_scale: 0.2
  t0_lower: 0.0
  rng:
    _target_: rdm_jax.SplittableKey
    seed: ${seed}
    stream: 1  # one per simulator role: experiment 0, prior 1, design 2, meta 3
is_batched: true # one call draws the whole batch; see the priors module docstring
