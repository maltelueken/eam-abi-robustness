# Study 2's low-fixed arm: a point prior at drift_slope_loc 1.5, the *inner* edge of the
# low-varying arm's U(0.7, 1.5). Fixed and varying arms share the edge that faces the rest of the
# sweep, so on every case above 1.5 both extrapolate the same distance from the same point and
# differ only in whether training also covered the band behind it. At the outer edge (0.7, where
# this used to sit) the varying arm started every such case 0.8 closer, confounding prior spread
# with reach. The marginal overlap with the varying partner barely moves (0.72 -> 0.71).
# At 1.5 this file is identical to rdm_simple.yaml; it stays a file of its own so study 1's base
# can move without silently moving this arm (tests/test_config.py pins it to that edge).
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: priors.rdm_prior_simple
  _partial_: true
  drift_intercept_loc: 1
  drift_intercept_scale: 0.5
  drift_slope_loc: 1.5
  drift_slope_scale: 0.5
  sd_true_shape: 12
  sd_true_scale: 0.1
  threshold_shape: 8
  threshold_scale: 0.15
  t0_loc: 0.3
  t0_scale: 0.2
  t0_lower: 0.0
  rng:
    _target_: rdm_jax.SplittableKey
    seed: ${seed}
    stream: 1  # one per simulator role: experiment 0, prior 1, design 2, meta 3
is_batched: true # one call draws the whole batch; see the priors module docstring
