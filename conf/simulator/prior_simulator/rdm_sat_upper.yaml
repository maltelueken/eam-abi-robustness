# Study 3's high-fixed arm: a point prior at threshold_diff_loc 1.6, the *inner* edge of the
# high-varying arm's U(1.6, 2.0), for the reason given in rdm_lower.yaml. rdm_sat.yaml is
# the centred version and explains the mean/sd parameterization.
_target_: bayesflow.simulators.LambdaSimulator
sample_fn:
  _target_: priors.rdm_prior_sat
  _partial_: true
  drift_intercept_loc: 1
  drift_intercept_scale: 0.5
  drift_slope_loc: 1.5
  drift_slope_scale: 0.5
  sd_true_shape: 12
  sd_true_scale: 0.1
  threshold_shape: 8
  threshold_scale: 0.15
  threshold_diff_loc: 1.6
  threshold_diff_sd: 0.245
  t0_loc: 0.3
  t0_scale: 0.2
  t0_lower: 0.0
  rng:
    _target_: rdm_jax.SplittableKey
    seed: ${seed}
    stream: 1  # one per simulator role: experiment 0, prior 1, design 2, meta 3
is_batched: true # one call draws the whole batch; see the priors module docstring
