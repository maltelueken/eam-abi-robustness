# Study 5 training condition: the prior is study 2's full meta prior, unchanged, and only the
# *data* are restricted -- `simulation` keeps drawing until every dataset in the batch has an
# empirical accuracy in this band. This is the unrestricted condition: 99.4% of the prior
# already lands in it, so it is the baseline the three narrow conditions are read against.
defaults:
- rdm_meta

acc_lower: 0.5
acc_upper: 1.0
