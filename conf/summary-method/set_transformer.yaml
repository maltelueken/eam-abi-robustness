# @package _global_

defaults:
  - override /approximator/summary_network: set_transformer

# As in `conf/inference-method/flow_matching.yaml`: the selected values live in
# `conf/architecture/<family>.yaml`; only the search space is spelled out here. Every key below
# is a plain global one that the summary network node interpolates, rather than a dotted path
# into the node -- `scripts/select_architecture.py` writes the sweeper's parameter names
# straight into the architecture file, so a swept knob has to be addressable as a bare key.
hydra:
  sweeper:
    params:
      summary_dim: range(8, 32)
      summary_embed_depth: range(1, 4)
      summary_embed_width: range(4, 8) # 16 - 256
      summary_num_seeds: range(1, 4)
      summary_expansion_factor: choice(2, 4, 8)
